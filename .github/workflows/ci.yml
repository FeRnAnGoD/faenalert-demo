name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: faenalert
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: faenalert
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faenalert"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://faenalert:ci-only-password@127.0.0.1:5432/faenalert
      JWT_SECRET: ci-only-secret-at-least-thirty-two-characters
      LOCAL_AUTH_ENABLED: "true"
      SEED_PASSWORD: ci-only-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .github/workflows/ci.yml
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm verify
